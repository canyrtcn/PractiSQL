name: Source verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:db
      - run: npm run test:ipc
      - run: npm run test:security
      - run: npm run test:stream
      - run: npm run test:schema
      - run: npm run test:layout
      - run: npm run test:security:integration
      - run: npm run test:ui
      - run: npm run test:appearance
      - run: npm run test:companion
      - run: npm run test:workshop
      - run: npm run test:interface-details
      - run: npm run docs:build
      - run: npm run docs:assets
      - run: npm run docs:showcase
      - run: npm run docs:showcase:render
      - run: npm run test:docs
      - run: npm run test:repository-docs
      - run: node scripts/scan-source.cjs
