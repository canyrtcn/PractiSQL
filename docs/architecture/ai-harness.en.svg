n</text><text x="70" y="323" font-size="17" fill="#59694f">Explicit learner constraints</text></g><g><rect x="492" y="190" width="416" height="172" rx="16" fill="#d5dfcc"/><rect x="492" y="186" width="416" height="172" rx="16" fill="white" stroke="#c3d1b9"/><text x="514" y="220" font-size="14" font-weight="700" fill="#387300">02</text><text x="514" y="258" font-size="21" font-weight="700">Context and teacher contract</text><text x="514" y="295" font-size="17" fill="#59694f">Schema, relevant history, current request</text><text x="514" y="323" font-size="17" fill="#59694f">Retrievable saved context sources</text></g><g><rect x="936" y="190" width="416" height="172" rx="16" fill="#d5dfcc"/><rect x="936" y="186" width="416" height="172" rx="16" fill="#e8f1df" stroke="#387300"/><text x="958" y="220" font-size="14" font-weight="700" fill="#387300">03</text><text x="958" y="258" font-size="21" font-weight="700">Model and read-only tools</text><text x="958" y="295" font-size="17" fill="#59694f">Your selected provider and model</text><text x="958" y="323" font-size="17" fill="#59694f">read_context · inspect_database</text></g><g><rect x="936" y="430" width="416" height="172" rx="16" fill="#d5dfcc"/><rect x="936" y="426" width="416" height="172" rx="16" fill="white" stroke="#c3d1b9"/><text x="958" y="460" font-size="14" font-weight="700" fill="#387300">04</text><text x="958" y="498" font-size="21" font-weight="700">SQL and teaching separation</text><text x="958" y="535" font-size="17" fill="#59694f">Execution contract and eligible SQL</text><text x="958" y="563" font-size="17" fill="#59694f">Teaching text stays a separate role</text></g><g><rect x="492" y="430" width="416" height="172" rx="16" fill="#d5dfcc"/><rect x="492" y="426" width="416" height="172" rx="16" fill="white" stroke="#c3d1b9"/><text x="514" y="460" font-size="14" font-weight="700" fill="#387300">05</text><text x="514" y="498" font-size="21" font-weight="700">Local SQLite execution</text><text x="514" y="535"